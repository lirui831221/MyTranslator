[workspace]

[package]
name = "my-translator"
version = "0.3.0"
description = "Local-first translator powered by llama.cpp + Hy-MT2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tokio = { version = "1", features = ["process", "time", "macros", "rt-multi-thread", "sync", "fs", "io-util", "net"] }
cpal = "0.15"
hound = "3"
zhconv = { version = "0.4.2", default-features = false, features = ["compress", "opencc"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
whatlang = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

[[bin]]
name = "my-translator"
path = "src/main.rs"
